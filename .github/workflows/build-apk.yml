name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Versi Release (Contoh: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Next.js & Capacitor APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js (v22) dengan Cache NPM
      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Setup Java JDK 17 dengan Cache Gradle
      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      # 4. Install Dependencies
      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      # 5. Build Next.js Web Application
      - name: Build Next.js Web
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      # 6. Pastikan Folder Android Terhubung dan Sync dengan Capacitor
      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Direktori android belum ada, menjalankan cap add android..."
            npx cap add android
          fi
          npx cap sync android

      # 7. Berikan Izin Eksekusi Gradle Wrapper
      - name: Grant Executable Permission for Gradlew
        run: chmod +x android/gradlew

      # 8. Compile & Build Android APK (Debug / Unaligned Release)
      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

      # 9. Format & Rename File APK agar Rapi
      - name: Prepare APK Artifacts
        id: prep_apk
        run: |
          mkdir -p release-assets
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          
          # Tentukan label versi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            VERSION_TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_TAG="${{ github.ref_name }}"
          else
            VERSION_TAG="v1.0.${{ github.run_number }}"
          fi

          APK_NAME="computer-pletig-${VERSION_TAG}.apk"
          
          if [ -f "$APK_SRC" ]; then
            cp "$APK_SRC" "release-assets/${APK_NAME}"
            echo "apk_path=release-assets/${APK_NAME}" >> $GITHUB_OUTPUT
            echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
            echo "Berhasil menyiapkan ${APK_NAME}"
          else
            echo "File APK tidak ditemukan di $APK_SRC"
            exit 1
          fi

      # 10. Backup File APK ke GitHub Actions Artifacts (Bisa diunduh langsung dari tab Actions)
      - name: Upload APK to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep_apk.outputs.version_tag }}-apk
          path: ${{ steps.prep_apk.outputs.apk_path }}
          retention-days: 30

      # 11. Publikasikan ke Halaman GitHub Releases (Otomatis saat Tag atau Manual Dispatch)
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_apk.outputs.version_tag }}
          name: "Release ${{ steps.prep_apk.outputs.version_tag }} (Android APK)"
          body: |
            ## 💻 computer.pletig - Ekstrakurikuler Komputer SDN Pleburan 03
            
            Versi rilis otomatis aplikasi Android (.APK) yang dibangun menggunakan **Next.js + Capacitor**.
            
            ### 📱 Detail Rilis:
            - **Versi Tag:** `${{ steps.prep_apk.outputs.version_tag }}`
            - **Komit:** `${{ github.sha }}`
            - **Tipe Build:** `Android APK (Debug/Standalone)`
            
            ### 📥 Panduan Instalasi:
            1. Unduh file `.apk` di bagian **Assets** di bawah.
            2. Buka file `.apk` di HP Android / Tablet siswa.
            3. Jika muncul konfirmasi keamanan, aktifkan *"Izinkan penginstalan aplikasi dari sumber ini"*.
            4. Aplikasi siap digunakan untuk kegiatan praktikum komputer SDN Pleburan 03!
          files: |
            ${{ steps.prep_apk.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

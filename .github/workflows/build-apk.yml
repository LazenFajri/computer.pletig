name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag Versi Release (Contoh: v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Next.js & Android APKs
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Node.js (v22) dengan Cache NPM
      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # 3. Setup Java JDK 21 dengan Cache Gradle
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'

      # 4. Install Dependencies
      - name: Install NPM Dependencies
        run: |
          npm ci || npm install

      # 5. Build Next.js Web Application
      - name: Build Next.js Web
        run: |
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      # 6. Pastikan Folder Android Terhubung dan Sync dengan Capacitor
      - name: Sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            echo "Direktori android belum ada, menjalankan cap add android..."
            npx cap add android
          fi
          npx cap sync android

      # 7. Berikan Izin Eksekusi Gradle Wrapper
      - name: Grant Executable Permission for Gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          if [ -f "android-admin-kotlin/gradlew" ]; then
            chmod +x android-admin-kotlin/gradlew
          fi

      # 8. Compile & Build Android APKs
      - name: Build Android APKs with Gradle
        run: |
          echo "=== 1. Building Capacitor Android (Siswa) ==="
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
          cd ..

          if [ -d "android-admin-kotlin" ]; then
            echo "=== 2. Building Native Kotlin Android (Admin Offline) ==="
            cd android-admin-kotlin
            ./gradlew assembleDebug --no-daemon --stacktrace
            cd ..
          fi

      # 9. Format & Rename File APK agar Rapi
      - name: Prepare APK Artifacts
        id: prep_apk
        run: |
          mkdir -p release-assets
          
          # Tentukan label versi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.release_tag }}" ]; then
            VERSION_TAG="${{ github.event.inputs.release_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_TAG="${{ github.ref_name }}"
          else
            VERSION_TAG="v1.0.${{ github.run_number }}"
          fi

          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT

          # Siswa APK
          APK_SISWA_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_SISWA_SRC" ]; then
            cp "$APK_SISWA_SRC" "release-assets/computer-pletig-siswa-${VERSION_TAG}.apk"
            cp "$APK_SISWA_SRC" "release-assets/computer-pletig-${VERSION_TAG}.apk"
            echo "Berhasil menyiapkan computer-pletig-siswa-${VERSION_TAG}.apk"
          fi

          # Admin Kotlin APK (Full Offline-first)
          # Admin Kotlin APK (Realtime Turso DB + Offline-Speed UI)
          APK_ADMIN_SRC="android-admin-kotlin/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_ADMIN_SRC" ]; then
            cp "$APK_ADMIN_SRC" "release-assets/computer-pletig-admin-realtime-${VERSION_TAG}.apk"
            cp "$APK_ADMIN_SRC" "release-assets/computer-pletig-admin-${VERSION_TAG}.apk"
            cp "$APK_ADMIN_SRC" "release-assets/computer-pletig-admin-offline-${VERSION_TAG}.apk"
            echo "Berhasil menyiapkan computer-pletig-admin-realtime-${VERSION_TAG}.apk"
          fi

      # 10. Backup File APK ke GitHub Actions Artifacts
      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prep_apk.outputs.version_tag }}-apks
          path: release-assets/*.apk
          retention-days: 30

      # 11. Publikasikan ke Halaman GitHub Releases (Otomatis saat Tag atau Manual Dispatch)
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep_apk.outputs.version_tag }}
          name: "Release ${{ steps.prep_apk.outputs.version_tag }} (Android APK)"
          body: |
            ## 💻 computer.pletig - Ekstrakurikuler Komputer SDN Pleburan 03
            
            Versi rilis resmi aplikasi Android (.APK) SDN Pleburan 03 Semarang:
            
            ### 📦 Aset Rilis Tersedia:
            1. **`computer-pletig-admin-realtime-${{ steps.prep_apk.outputs.version_tag }}.apk`** (atau `computer-pletig-admin-${{ steps.prep_apk.outputs.version_tag }}.apk`)
               - Aplikasi Native Kotlin (Jetpack Compose + Turso Cloud Realtime DB + Room SQLite Cache).
               - Khusus Pembina/Guru: Desain UI secepat Offline (0ms latency Room cache) terintegrasi langsung dua arah secara Realtime dengan Database Turso Cloud AWS Tokyo. Kontrol Sesi Otomatis & Acak Token 4-Digit, Matriks Presensi Siswa per Rombel, dan Penilaian Tugas.
            2. **`computer-pletig-siswa-${{ steps.prep_apk.outputs.version_tag }}.apk`** (atau `computer-pletig-${{ steps.prep_apk.outputs.version_tag }}.apk`)
               - Aplikasi Siswa: Portal Presensi 1 Laptop 1/2 Orang, Token Otomatis Presensi, Tugas Mingguan, dan Praktikum Komputer SDN Pleburan 03.
            
            ### 📱 Detail Versi:
            - **Versi Tag:** `${{ steps.prep_apk.outputs.version_tag }}`
            - **Komit:** `${{ github.sha }}`
            
            ### 📥 Panduan Instalasi:
            1. Unduh file `.apk` sesuai kebutuhan (Admin atau Siswa) di bagian **Assets** di bawah.
            2. Buka file `.apk` di HP Android / Tablet.
            3. Jika muncul konfirmasi keamanan, aktifkan *"Izinkan penginstalan aplikasi dari sumber ini"*.
            4. Aplikasi siap digunakan!
          files: |
            release-assets/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

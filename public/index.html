<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>computer.pletig - SDN Pleburan 03</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f8fafc;
      text-align: center;
      color: #1e293b;
    }
    .card {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      max-width: 360px;
      margin: 1rem;
    }
    .logo {
      width: 72px;
      height: 72px;
      border-radius: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 0.5rem 0;
      color: #0f172a;
    }
    p {
      font-size: 0.875rem;
      color: #64748b;
      line-height: 1.5;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 1rem;
      font-weight: bold;
      font-size: 0.875rem;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="logo.jpg" alt="Logo computer.pletig" class="logo">
    <h1>computer.pletig</h1>
    <p>Portal Ekstrakurikuler Komputer SDN Pleburan 03 Semarang.</p>
    <p style="font-size: 0.8rem; color: #64748b; margin-top: -0.75rem; margin-bottom: 1.25rem;">
      Menghubungkan ke server... Pastikan perangkat Anda terhubung ke internet.
    </p>
    <button class="btn" onclick="retryConnection()">Buka Aplikasi / Coba Lagi</button>
  </div>
  <script>
    function retryConnection() {
      window.location.href = 'https://computer-pletig.vercel.app';
    }
    // Jika perangkat online, otomatis arahkan langsung ke aplikasi Vercel
    if (navigator.onLine) {
      setTimeout(retryConnection, 300);
    }
  </script>
</body>
</html>
